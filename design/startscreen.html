<!doctype html><html lang="de"><head><meta charset="utf-8">
<style>
:root{--green:#1FA350;--deep:#0B3B24;--yellow:#FFD23F;--white:#fff;--ink:#10241A}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:1000px;background:var(--green);font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#fff;position:relative;overflow:hidden}
.sun{position:absolute;right:-180px;top:-220px;width:760px;height:760px;border-radius:50%;background:var(--yellow)}
.hill{position:absolute;left:-100px;right:-100px;bottom:-330px;height:520px;border-radius:50% 50% 0 0;background:var(--deep)}
.cairn{position:absolute;left:1000px;top:150px;width:1200px;filter:drop-shadow(4px 4px 0 #0B3B24)}
.wrap{position:absolute;left:120px;top:110px;width:1000px}
.kicker{display:inline-block;font-weight:800;font-size:34px;letter-spacing:.02em;background:#fff;color:var(--green);padding:8px 22px;border-radius:40px;transform:rotate(-2deg)}
h1{margin-top:26px;font-weight:900;line-height:.86;text-transform:none}
.a{display:block;font-size:210px;letter-spacing:-.045em;color:#fff;text-shadow:8px 8px 0 var(--deep)}
.b{display:inline-block;margin-top:14px;font-size:150px;letter-spacing:-.03em;background:var(--yellow);color:var(--ink);padding:6px 34px 18px;border-radius:22px;transform:rotate(-1.5deg);box-shadow:8px 8px 0 var(--deep)}
p{margin-top:44px;font-size:36px;line-height:1.3;font-weight:600;max-width:860px}
p b{white-space:nowrap;background:var(--yellow);color:var(--ink);padding:0 10px;border-radius:8px;font-weight:900}
.btn{position:absolute;left:120px;top:800px;display:inline-flex;gap:22px;align-items:center;background:#fff;color:var(--ink);font-weight:900;font-size:40px;padding:26px 44px;border-radius:70px;box-shadow:8px 8px 0 var(--deep)}
.btn i{font-style:normal;background:var(--green);color:#fff;border-radius:50%;width:56px;height:56px;display:grid;place-items:center;font-size:34px}
.stat{position:absolute;right:130px;top:560px;width:300px;height:300px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-content:center;text-align:center;transform:rotate(8deg);box-shadow:10px 10px 0 var(--deep)}
.stat strong{font-size:130px;font-weight:900;line-height:.9;color:var(--green);letter-spacing:-.04em}
.stat span{font-size:28px;font-weight:800;line-height:1.1;margin-top:6px}
</style></head><body>
<div class="sun"></div><div class="hill"></div>
<img class="cairn" src="cairn.png">
<div class="wrap">
 <span class="kicker">Entdecke das</span>
 <h1><span class="a">Supergrätzl</span><span class="b">Lichtental</span></h1>
 <p>Im Herbst 2023 haben <b>250 Nachbar:innen</b> mit uns geplant – in je einem Workshop pro Gasse.</p>
</div>
<div class="btn">Supergrätzl entdecken <i>→</i></div>
</body></html>
